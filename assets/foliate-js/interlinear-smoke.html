<!doctype html>
<meta charset="utf-8">
<title>Interlinear compatibility checks</title>
<pre id="results">Running…</pre>
<script type="module">
import { Translator, TranslationMode } from './src/translator.js'
import * as CFI from './src/epubcfi.js'
const checks = []
const check = (condition, message) => {
  if (!condition) throw new Error(message)
  checks.push(message)
}
// Keep the observer deterministic; force-translate exercises the real batch path.
window.IntersectionObserver = class { observe() {} disconnect() {} unobserve() {} }
async function fixture(handler, html = '<p>Olá, mundo!</p>') {
  const frame = document.createElement('iframe')
  frame.style.cssText = 'width:800px;height:400px;display:block'
  document.body.append(frame)
  frame.contentDocument.body.innerHTML = html
  const translator = new Translator()
  window.flutter_inappwebview = { callHandler: handler }
  translator.observeDocument(frame.contentDocument, () => 'epubcfi(/6/2!/4/2:0)')
  translator.setTranslationLevel('a1')
  return { translator, frame, p: frame.contentDocument.querySelector('p') }
}
try {
  const originals = []
  const taps = []
  const { translator, frame, p } = await fixture(async (name, texts) => {
    if (name === 'onVocabularyWordTap') { taps.push(texts); return null }
    if (name === 'translateBatch') {
      originals.push(JSON.parse(texts))
      return JSON.stringify(['[Olá|Привет|a1], [mundo|мир|b1]!'])
    }
    return '{}'
  })
  await translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(p.querySelectorAll('ruby rt').length === 2, 'two interlinear hints rendered')
  const visibleOriginal = () => { const copy = p.querySelector('.translated-text').cloneNode(true); copy.querySelectorAll('rt').forEach(rt => rt.remove()); return copy.textContent }
  check(visibleOriginal() === 'Olá, mundo!', 'hints preserve exact original spacing and punctuation')
  translator.updateWordLevels({ 'olá': 'b2' })
  check(p.querySelector('rt[data-level="b2"]').textContent === 'Привет' && originals.length === 1, 'background CEFR updates hints without provider requests')
  translator.updateWordLevels({ 'olá': 'a1' })
  translator.setVocabularyStatuses({ 'olá': 'known', 'mundo': 'learning' })
  translator.setTranslationLevel('c2')
  check(p.querySelectorAll('rt').length === 1 && p.querySelector('rt').textContent === 'мир', 'personal states override CEFR')
  const known = p.querySelector('[data-vocabulary-word="Olá"]')
  known.dispatchEvent(new MouseEvent('click', { bubbles: true }))
  check(taps.length === 1 && taps[0].translation === 'Привет' && taps[0].contextText === 'Olá, mundo!' && taps[0].cfi === 'epubcfi(/6/2!/4/2:0)', 'tap keeps hidden translation, original context and original CFI')
  known.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: 1, clientY: 1 }))
  known.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 1, clientX: 100, clientY: 100 }))
  check(taps.length === 1, 'drag does not open word menu')
  const selection = frame.contentDocument.getSelection()
  const range = frame.contentDocument.createRange()
  range.selectNodeContents(known)
  selection.addRange(range)
  known.dispatchEvent(new MouseEvent('click', { bubbles: true }))
  check(taps.length === 1, 'selection does not open word menu')
  selection.removeAllRanges()
  known.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'Enter' }))
  check(taps.length === 2, 'keyboard opens word menu')
  translator.observeDocument(frame.contentDocument)
  known.dispatchEvent(new MouseEvent('click', { bubbles: true }))
  check(taps.length === 3, 'reobserving a document does not duplicate tap handlers')
  let annotations = 0
  const annotationClick = event => {
    event.preventDefault()
    event.stopPropagation()
    annotations++
  }
  // View installs annotation capture after the translator has observed the doc.
  frame.contentDocument.addEventListener('click', annotationClick, true)
  known.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
  check(annotations === 1 && taps.length === 3, 'annotation capture wins over vocabulary')
  frame.contentDocument.removeEventListener('click', annotationClick, true)
  const link = frame.contentDocument.createElement('a')
  link.href = '#example'
  known.replaceWith(link)
  link.append(known)
  let links = 0
  link.addEventListener('click', event => { event.preventDefault(); links++ })
  known.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
  check(links === 1 && taps.length === 3, 'links keep their own action')
  link.replaceWith(known)
  translator.setVocabularyStatuses({})
  translator.setTranslationLevel('a1')
  translator.setTranslationColors(true, JSON.stringify({ a1: '#008000', b1: '#0000ff' }))
  check(p.querySelector('rt[data-level="a1"]').style.color === 'rgb(0, 128, 0)', 'CEFR color restored')
  translator.setTranslationLevel('b1')
  check(p.querySelectorAll('ruby rt').length === 1, 'CEFR hides easy hints without another request')
  check(originals.length === 1, 'CEFR reuses translated text')
  translator.setTranslationLevel('a1')
  translator.softRetranslateAll()
  await new Promise(resolve => setTimeout(resolve, 50))
  check(originals.length === 2 && originals[1][0] === 'Olá, mundo!', 'retranslation sends original, excluding hints')
  await translator.setTranslationMode(TranslationMode.OFF)
  check(p.innerText === 'Olá, mundo!', 'off mode restores visible original')
  translator.destroy()
  check(p.textContent === 'Olá, mundo!' && !p.querySelector('.translated-text'), 'destroy preserves original DOM')
  frame.remove()

  let resolveBatch
  const pending = new Promise(resolve => { resolveBatch = resolve })
  const second = await fixture(async name => name === 'translateBatch' ? pending : '{}')
  const inFlight = second.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  await Promise.resolve()
  second.translator.cancelAndClear()
  resolveBatch(JSON.stringify(['[Olá|Привет|a1], [mundo|мир|b1]!']))
  await inFlight
  check(!second.p.querySelector('.translated-text'), 'cancelled generation never applies a late result')
  second.translator.destroy()
  second.frame.remove()

  const json = await fixture(async name => name === 'translateBatch' ?
    JSON.stringify([JSON.stringify([['Olá', 'Привет', 'a1'], ['mundo', 'мир', 'b1']])]) : '{}')
  await json.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  json.translator.setTranslationLevel('b1')
  check(json.p.querySelectorAll('rt').length === 1, 'JSON pairs also obey CEFR')
  json.translator.setVocabularyStatuses({ 'olá': 'learning', 'mundo': 'known' })
  check(json.p.querySelectorAll('rt').length === 1 && json.p.querySelector('rt').textContent === 'Привет', 'JSON pairs obey personal states')
  json.translator.destroy()
  json.frame.remove()
  const marks = await fixture(async name => name === 'translateBatch' ?
    JSON.stringify([JSON.stringify([['cafe\u0301', 'кофе'], ['தமிழ்', 'тамильский']])]) : '{}', '<p>cafe\u0301 தமிழ்</p>')
  marks.translator.setVocabularyStatuses({ 'cafe\u0301': 'known', 'தமிழ்': 'known' })
  await marks.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(marks.p.querySelectorAll('rt').length === 0, 'combining marks stay in vocabulary keys')
  marks.translator.destroy()
  marks.frame.remove()
  const inline = await fixture(async name => name === 'translateBatch' ?
    JSON.stringify(['[Olá|Привет|a1], [mundo|мир|b1]!']) : '{}', '<p><em>Olá</em>, <a href="#example">mundo</a>!</p>')
  await inline.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(inline.p.querySelector('.translated-text em ruby') && inline.p.querySelector('.translated-text a ruby'), 'inline emphasis and links survive rendering')
  const originalSelection = inline.frame.contentDocument.createRange()
  const bases = inline.p.querySelectorAll('.translated-text ruby > span')
  originalSelection.setStart(bases[0].firstChild, 0)
  originalSelection.setEnd(bases[1].firstChild, 5)
  inline.frame.contentDocument.getSelection().addRange(originalSelection)
  const selected = inline.translator.withSourceRange(originalSelection, range => ({ text: range.toString(), cfi: CFI.fromRange(range) }))
  check(selected.text === 'Olá, mundo', 'phrase selection excludes RT hints')
  const entireParagraph = inline.frame.contentDocument.createRange()
  entireParagraph.selectNodeContents(inline.p)
  check(inline.translator.withSourceRange(entireParagraph, range => range.toString()) === 'Olá, mundo!', 'element selection boundaries exclude removable overlay children')
  inline.translator.updateWordLevels({ 'olá': 'b2' })
  check(!inline.frame.contentDocument.getSelection().isCollapsed, 'background levels preserve active phrase selection')
  const restoredSelection = inline.translator.resolveSourceRange(inline.frame.contentDocument, () => CFI.toRange(inline.frame.contentDocument, CFI.parse(selected.cfi)))
  check(inline.translator.withSourceRange(restoredSelection, range => range.toString()) === 'Olá, mundo', 'saved source CFI resolves while hints are displayed')
  await inline.translator.setTranslationMode(TranslationMode.OFF)
  const offRange = inline.translator.resolveSourceRange(inline.frame.contentDocument, () => CFI.toRange(inline.frame.contentDocument, CFI.parse(selected.cfi)))
  check(offRange.toString() === 'Olá, mundo' && !offRange.startContainer.parentElement.closest('.translated-text') && offRange.getBoundingClientRect().width > 0, 'OFF mode resolves to visible original source')
  await inline.translator.setTranslationMode(TranslationMode.ORIGINAL_ONLY)
  const onlyRange = inline.translator.resolveSourceRange(inline.frame.contentDocument, () => CFI.toRange(inline.frame.contentDocument, CFI.parse(selected.cfi)))
  check(onlyRange.toString() === 'Olá, mundo' && !onlyRange.startContainer.parentElement.closest('.translated-text'), 'ORIGINAL_ONLY mode keeps source CFI endpoints')
  inline.translator.destroy()
  check(CFI.toRange(inline.frame.contentDocument, CFI.parse(selected.cfi)).toString() === 'Olá, mundo', 'saved phrase CFI survives removing translation')
  inline.frame.remove()
  let resolveCache
  const delayedCache = new Promise(resolve => { resolveCache = resolve })
  const cached = await fixture(async name => name === 'checkTranslationCache' ? delayedCache : '{}')
  const cacheFlight = cached.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  await Promise.resolve()
  cached.translator.cancelAndClear()
  resolveCache(JSON.stringify({ 'Olá, mundo!': '[Olá|Привет|a1], [mundo|мир|b1]!' }))
  await cacheFlight
  check(!cached.p.querySelector('.translated-text'), 'cancelled generation rejects delayed cache hits')
  cached.translator.destroy(); cached.frame.remove()
  let batchCalls = 0
  const warm = await fixture(async (name, text) => {
    if (name === 'translateBatch') { batchCalls++; return '[]' }
    return name === 'checkTranslationCache' ? JSON.stringify({ 'Olá, mundo!': '[Olá|Привет|a1], [mundo|мир|b1]!' }) : '{}'
  })
  const start = performance.now()
  await warm.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  warm.translator.onRelocated('page')
  await new Promise(resolve => setTimeout(resolve, 30))
  check(batchCalls === 0 && warm.p.querySelector('rt') && performance.now() - start < 300, 'warm page renders from cache without provider or two-second delay')
  warm.translator.destroy(); warm.frame.remove()
  let partialCalls = 0
  const partial = await fixture(async name => {
    if (name !== 'translateBatch') return '{}'
    partialCalls++
    return JSON.stringify([partialCalls === 1 ? '__ANX_PARTIAL__[Olá|Привет|a1], mundo!' : '[Olá|Привет|a1], [mundo|мир|b1]!'])
  })
  await partial.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(partial.p.querySelectorAll('rt').length === 1 && partial.p.querySelector('[data-vocabulary-word="mundo"]'), 'partial result shows good hints and omitted words remain tappable')
  await new Promise(resolve => setTimeout(resolve, 900))
  check(partialCalls === 2 && partial.p.querySelectorAll('rt').length === 2, 'partial translation retries and completes remaining hints')
  partial.translator.destroy(); partial.frame.remove()
  let failedCalls = 0
  const failed = await fixture(async name => {
    if (name !== 'translateBatch') return '{}'
    failedCalls++
    return JSON.stringify([failedCalls <= 2 ? '__ANX_PARTIAL__Olá, mundo!' : '[Olá|Привет|a1], [mundo|мир|b1]!'])
  })
  await failed.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(failed.p.querySelector('[data-vocabulary-word="mundo"]') && !failed.p.querySelector('rt'), 'all-failed reply keeps original tappable without caching empty success')
  await new Promise(resolve => setTimeout(resolve, 900))
  window.repeatedPartialEvidence = {calls:failedCalls,wrappers:failed.p.querySelectorAll('.translated-text').length,text:failed.p.innerText}
  check(failedCalls === 2 && failed.p.querySelectorAll('.translated-text').length === 1 && failed.p.innerText === 'Olá, mundo!', 'consecutive all-failed partials keep exactly one source copy')
  failed.translator.updateWordLevels({'olá':'b2'})
  failed.translator.setVocabularyStatuses({'mundo':'learning'})
  failed.translator.setTranslationLevel('c2')
  check(!failed.p.querySelector('rt') && failed.p.innerText === 'Olá, mundo!', 'local updates never display untranslated source as a hint')
  failed.translator.setTranslationLevel('a1')
  await new Promise(resolve => setTimeout(resolve, 1600))
  check(failedCalls === 3 && failed.p.querySelectorAll('rt').length === 2 && failed.p.querySelectorAll('.translated-text').length === 1, 'all-failed partial remains retryable and successful hints replace it')
  failed.translator.destroy(); failed.frame.remove()
  let configCalls = 0, configured = false
  const config = await fixture(async name => {
    if (name !== 'translateBatch') return '{}'
    configCalls++
    return JSON.stringify([configured ? '[Olá|Привет|a1], [mundo|мир|b1]!' : '__ANX_CONFIG_REQUIRED__'])
  })
  await config.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  await new Promise(resolve => setTimeout(resolve, 900))
  check(configCalls === 1 && config.p.innerText === 'Olá, mundo!' && !config.p.querySelector('.translated-text'), 'missing provider configuration keeps source intact without automatic retries')
  configured = true
  config.translator.onRelocated('page')
  await new Promise(resolve => setTimeout(resolve, 350))
  check(configCalls === 2 && config.p.querySelectorAll('rt').length === 2, 'translation resumes after configuration and page relocation')
  config.translator.destroy(); config.frame.remove()
  const priorityCalls = []
  const priority = await fixture(async (name, texts) => {
    if (name !== 'translateBatch') return '{}'
    const group = JSON.parse(texts)
    priorityCalls.push(group)
    return JSON.stringify(group.map(text => `[${text}|перевод|a1]`))
  }, '<p>Current</p><p>Ahead</p>')
  priority.translator.setAiWorkers(2)
  const ahead = priority.frame.contentDocument.querySelectorAll('p')[1]
  ahead.getBoundingClientRect = () => ({ top: window.innerHeight + 20, bottom: window.innerHeight + 40, left: 0, right: 100 })
  await priority.translator.setTranslationMode(TranslationMode.INTERLINEAR)
  check(priorityCalls.length === 2 && priorityCalls[0][0] === 'Current' && priorityCalls[1][0] === 'Ahead', 'current page completes before prefetch consumes provider slots')
  priority.translator.destroy(); priority.frame.remove()
  window.testResult = { passed: true, checks }
} catch (error) {
  window.testResult = { passed: false, checks, error: error.message }
}
document.querySelector('#results').textContent = JSON.stringify(window.testResult, null, 2)
</script>
